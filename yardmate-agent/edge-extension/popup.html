<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body{width:330px;margin:0;padding:14px;background:#09131d;color:#edf8ff;font:13px/1.4 system-ui,sans-serif}
  h1{margin:0 0 5px;font-size:17px}p{margin:0 0 12px;color:#9fb4c4}
  button{width:100%;min-height:40px;border:1px solid #2ea6a1;border-radius:8px;background:#17736f;color:#fff;font-weight:900;cursor:pointer}
  button:disabled{cursor:not-allowed;opacity:.55}
  button+button{margin-top:9px}
  #alertMeter{border-color:#4f8ee8;background:#235da8}
  .schedule{display:block;margin:10px 0;padding:10px;border:1px solid #294358;border-radius:8px;background:#102231}
  .schedule label{margin:0;padding:0;border:0;background:transparent}
  .schedule small{display:block;margin:6px 0 0 28px;color:#9fb4c4;font-size:10px}
  label{display:flex;align-items:center;gap:9px;margin:11px 0;padding:10px;border:1px solid #294358;border-radius:8px;background:#102231;font-weight:800}
  input{width:19px;height:19px;accent-color:#25b990}
  #status{margin-top:10px;color:#8ee8df;font-size:11px;font-weight:700}
</style>
</head>
<body>
<h1>Settegast Alerts <small id="version"></small></h1>
<p>Scheduled and manual operational alerts through YardMate.</p>
<button id="run">Run Mismatch Now</button>
<button id="alertMeter">Run AlertMeter Now</button>
<div class="schedule"><label><input id="mismatchSchedule" type="checkbox"> Mismatch schedule</label><small>01:00 · 03:00 · 06:00 · 09:00 · 11:00 · 13:00 · 15:00 · 18:00 · 21:00 · 23:00</small></div>
<div class="schedule"><label><input id="alertMeterSchedule" type="checkbox"> AlertMeter compliance check</label><small>03:45 · 10:30 · 15:45 · 20:00 · screenshot sent every run</small></div>
<div id="status">Checking export status…</div>
<script src="popup.js"></script>
</body>
</html>
