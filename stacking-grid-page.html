<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Track 809/808 Dual View</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e9edef;font-family:-apple-system,BlinkMacSystemFont,Arial;color:#101820}
header{position:sticky;top:0;z-index:100;background:#172029;color:#fff;padding:8px;box-shadow:0 2px 8px #0004}
.viewbar,.controls{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px}
button,.mode{border:0;border-radius:8px;padding:10px 12px;font-weight:900;font-size:14px;white-space:nowrap}
.viewbtn{background:#35424d;color:#fff}
.viewbtn.active{background:#f0b400;color:#111}
.mode{background:#35424d;display:flex;align-items:center;gap:4px}
.status{font-size:12px;font-weight:800;color:#9cf0a8;margin-bottom:6px}
.viewport{width:100%;overflow:hidden;padding:0}
.sheet{width:max-content;min-width:1490px;background:#111820;border:4px solid #111820;display:grid;grid-template-columns:86px auto 88px 92px;grid-template-rows:45px auto 45px}
.track,.back,.front,.crane{background:#111820;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center}
.track{grid-column:1;grid-row:1/4} .back{grid-column:2/4;grid-row:1} .front{grid-column:2/4;grid-row:3} .crane{grid-column:4;grid-row:1/4}
.yardgrid{grid-column:2;grid-row:2;background:#c9cccb;padding:8px;display:grid;grid-template-columns:repeat(7,190px);gap:1px 8px}
.rowlabels{grid-column:3;grid-row:2;background:#c9cccb;padding:8px 5px;display:grid;gap:1px}
.rowlabels div{background:#eee;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;height:42px}
.unit{height:42px;position:relative;background:#fafafa;border:1px solid #aeb4b7;display:flex;min-width:0}
.unit.green{background:#83dc8e}
.handle{width:38px;min-width:38px;border:0;border-right:1px solid #abb1b5;background:#d9dfe2;font-size:18px;font-weight:900;touch-action:none}
.label{flex:1;border:0;background:transparent;font-size:16px;font-weight:900;text-align:left;padding:6px 7px;white-space:nowrap}
.unit.selected{outline:4px solid #ffc928;z-index:3}
.unit.target{outline:4px solid #2979ff;z-index:4}
.ghost{position:fixed;z-index:9999;pointer-events:none;background:white;border:3px solid #2979ff;border-radius:8px;padding:10px 14px;font-weight:900;box-shadow:0 4px 14px #0006}

#gridView,#yardView{width:100%;overflow:hidden}
#yardView{display:none;background:#0b1014;height:100%;padding:0;overflow:hidden}
.yard-shell{min-width:1490px;background:#10161a;border:4px solid #0a0d0f;color:white;display:grid;grid-template-columns:86px auto 96px;grid-template-rows:48px auto 48px}
.y-track,.y-back,.y-front{background:#0b0f12;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center}
.y-track{grid-column:1;grid-row:1/4} .y-back{grid-column:2/4;grid-row:1} .y-front{grid-column:2/4;grid-row:3}
.y-map{grid-column:2;grid-row:2;padding:14px;background:linear-gradient(#151c20,#11171b);display:grid;grid-template-columns:repeat(7,190px);gap:14px 18px}
.y-right{grid-column:3;grid-row:2;padding:14px 6px;display:grid;gap:14px;background:#0b0f12}
.y-pair{height:90px;display:grid;grid-template-rows:1fr 1fr;border:1px solid #30383d;background:#0b0f12}
.y-pair div{display:flex;align-items:center;justify-content:center;font-weight:900}
.y-pair div+div{border-top:1px solid #30383d}
.y-slot{height:38px;border:2px solid #687178;background:#151b1f;position:relative;border-radius:3px}
.y-slot.empty:before,.y-slot.empty:after{content:"";position:absolute;width:12px;height:12px;border-color:#efb300}
.y-slot.empty:before{left:4px;top:4px;border-left:3px solid #efb300;border-top:3px solid #efb300}
.y-slot.empty:after{right:4px;bottom:4px;border-right:3px solid #efb300;border-bottom:3px solid #efb300}
.y-container{position:absolute;inset:2px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:white;text-shadow:0 1px 2px #000;touch-action:none;user-select:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),#3d4a54}
.y-container.green{background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),#315d2d}
.y-container.c1{background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),#7a3f27}
.y-container.c2{background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),#173b61}
.y-container.c3{background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),#555}
.y-slot.selected{outline:4px solid #ffc928}
.y-slot.target{outline:4px solid #2979ff}

/* --- stacked YARD VIEW pairs --- */
.y-map{
  grid-template-columns:repeat(7,190px);
  gap:16px 18px;
}
.y-stack{
  height:90px;
  position:relative;
  border:2px solid #687178;
  background:#151b1f;
  border-radius:3px;
  box-shadow:inset 0 0 0 2px #222a2e,0 3px 8px #0007;
  overflow:visible;
}
.y-half{
  position:absolute;
  left:2px;
  right:2px;
  height:42px;
  border:1px solid rgba(255,255,255,.08);
}
.y-half.top{top:2px}
.y-half.bottom{bottom:2px}
.y-half.empty:before,.y-half.empty:after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
}
.y-half.empty:before{
  left:4px;top:4px;
  border-left:3px solid #efb300;
  border-top:3px solid #efb300;
}
.y-half.empty:after{
  right:4px;bottom:4px;
  border-right:3px solid #efb300;
  border-bottom:3px solid #efb300;
}
.y-container{
  position:absolute;
  inset:0;
  border:2px solid rgba(255,255,255,.14);
  border-radius:2px;
}
.y-half.top .y-container{box-shadow:0 3px 5px #0007}
.y-half.bottom .y-container{box-shadow:0 3px 5px #0007}
.y-half.selected{outline:4px solid #ffc928;z-index:6}
.y-half.target{outline:4px solid #2979ff;z-index:7}


/* Subtle 3D container treatment in YARD VIEW */
.y-half{
  perspective:500px;
  overflow:visible !important;
}
.y-container{
  overflow:visible;
  transform:translateY(4px);
  border-top:none !important;
  box-shadow:
    0 5px 7px rgba(0,0,0,.55),
    inset -5px 0 5px rgba(0,0,0,.18),
    inset 4px 0 3px rgba(255,255,255,.05) !important;
}
.y-container::before{
  content:"";
  position:absolute;
  left:-2px;
  right:-2px;
  height:10px;
  top:-9px;
  background:inherit;
  border:2px solid rgba(255,255,255,.14);
  border-bottom:1px solid rgba(0,0,0,.4);
  transform-origin:bottom center;
  transform:skewX(-13deg);
  filter:brightness(1.28);
  z-index:-1;
  pointer-events:none;
}
.y-container::after{
  content:"";
  position:absolute;
  top:0;
  bottom:-2px;
  width:6px;
  right:-6px;
  background:inherit;
  filter:brightness(.68);
  transform:skewY(-18deg);
  transform-origin:left top;
  border-right:1px solid rgba(255,255,255,.08);
  pointer-events:none;
}
.y-half.top .y-container{
  z-index:4;
}
.y-half.bottom .y-container{
  z-index:2;
}
.y-stack{
  overflow:visible !important;
}


/* --- TRUE STACKED CONTAINER PAIRING --- */
/* Make TOP visually sit directly on BOTTOM when both are occupied. */
.y-stack{
  height:88px !important;
  overflow:visible !important;
}

.y-half{
  height:42px !important;
  overflow:visible !important;
}

/* Bottom container establishes the base. */
.y-half.bottom{
  bottom:2px !important;
  top:auto !important;
}

/* Top container sits directly on the bottom container instead of floating above it. */
.y-half.top{
  top:2px !important;
  bottom:auto !important;
  z-index:5;
}

/* Occupied top/bottom halves touch with essentially no visual gap. */
.y-half.top .y-container{
  bottom:-1px !important;
  transform:translateY(0) !important;
  z-index:5;
}

.y-half.bottom .y-container{
  top:-1px !important;
  transform:translateY(0) !important;
  z-index:2;
}

/* Only the TOP container gets a visible roof when there is a pair.
   The bottom container should read as the lower box, not as a separate floating box. */
.y-half.bottom .y-container::before{
  display:none !important;
}

.y-half.top .y-container::before{
  display:block !important;
  height:9px !important;
  top:-8px !important;
}

/* Tighten the seam between paired containers. */
.y-half.top .y-container{
  box-shadow:
    0 2px 2px rgba(0,0,0,.45),
    inset -5px 0 5px rgba(0,0,0,.18),
    inset 4px 0 3px rgba(255,255,255,.05) !important;
}

.y-half.bottom .y-container{
  box-shadow:
    0 5px 7px rgba(0,0,0,.55),
    inset -5px 0 5px rgba(0,0,0,.18),
    inset 4px 0 3px rgba(255,255,255,.05) !important;
}

/* If TOP is empty and BOTTOM occupied, let the bottom container show its own roof. */
.y-half.top.empty + .y-half.bottom .y-container::before{
  display:block !important;
  height:9px !important;
  top:-8px !important;
}

/* If BOTTOM is empty, TOP still appears as a single container with its roof. */
.y-half.bottom.empty{
  background:transparent;
}


/* --- quieter parking slots + hide slot frame when occupied --- */
.y-half{
  border-color:rgba(120,132,140,.28) !important;
  background:rgba(18,24,28,.48) !important;
  box-shadow:none !important;
}

/* Occupied positions: remove visible parking-slot framing entirely. */
.y-half:not(.empty){
  border-color:transparent !important;
  background:transparent !important;
  outline:none !important;
}

/* Empty positions remain visible but much more subtle. */
.y-half.empty{
  border:1px solid rgba(120,132,140,.26) !important;
  background:rgba(18,24,28,.22) !important;
}

/* Soften the yellow corner markers substantially. */
.y-half.empty::before,
.y-half.empty::after{
  opacity:.38 !important;
  width:8px !important;
  height:8px !important;
}
.y-half.empty::before{
  border-left-width:2px !important;
  border-top-width:2px !important;
}
.y-half.empty::after{
  border-right-width:2px !important;
  border-bottom-width:2px !important;
}

/* Also tone down the outer bay/stack frame. */
.y-stack{
  border-color:rgba(110,122,130,.22) !important;
  background:rgba(15,21,25,.15) !important;
  box-shadow:none !important;
}
.y-stack:has(.y-half:not(.empty)){
  border-color:transparent !important;
  background:transparent !important;
}

/* Keep selection obvious only when actively selected. */
.y-half.selected{
  outline:3px solid #ffc928 !important;
  outline-offset:2px !important;
}


.y-container.c4{
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),
    #6d5523 !important;
}
.y-container.c5{
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),
    #235c63 !important;
}
.y-container.c6{
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),
    #623b59 !important;
}

/* If both stacked units are green-status, keep the status meaning but
   visually separate the upper box from the lower box. */
.y-stack:has(.y-half.top .y-container.green):has(.y-half.bottom .y-container.green)
.y-half.top .y-container.green{
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),
    #3f6d31 !important;
}
.y-stack:has(.y-half.top .y-container.green):has(.y-half.bottom .y-container.green)
.y-half.bottom .y-container.green{
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 3px,rgba(0,0,0,.08) 3px 7px),
    #24535b !important;
}
/* Green-status marker remains visible even if the base container color differs. */
.y-container.green::marker{display:none}
.y-container.green{
  border-left:4px solid #7ee787 !important;
}


/* APP FIX: bottom-only occupied stacks */
.y-stack:has(.y-half.bottom:not(.empty)) .y-half.top.empty{
  border-color:transparent !important;
  background:transparent !important;
  outline:none !important;
  box-shadow:none !important;
}
.y-stack:has(.y-half.bottom:not(.empty)) .y-half.top.empty::before,
.y-stack:has(.y-half.bottom:not(.empty)) .y-half.top.empty::after{
  display:none !important;
}

/* Remove bright green edge strip from green-status containers */
.y-container.green{
  border-left:2px solid rgba(255,255,255,.14) !important;
}

/* Occupied slots should not show parking framing */
.y-half:not(.empty){
  border-color:transparent !important;
  background:transparent !important;
  box-shadow:none !important;
}


/* Reach stacker equipment row */
.y-map{
  position:relative !important;
}
.y-stack.machine-row{
  opacity:.22;
}
.y-stack.machine-row .y-half{
  background:rgba(15,21,25,.05) !important;
  border-color:rgba(120,132,140,.14) !important;
}
.y-stack.machine-row .y-half::before,
.y-stack.machine-row .y-half::after{
  opacity:.12 !important;
}
.yard-machine-fixed{
  display:block !important;
  position:absolute !important;
  left:9% !important;
  bottom:-5px !important;
  width:390px !important;
  height:auto !important;
  max-height:150px !important;
  object-fit:contain !important;
  z-index:100 !important;
  pointer-events:none !important;
  user-select:none !important;
  -webkit-user-select:none !important;
  filter:drop-shadow(0 8px 7px rgba(0,0,0,.75)) !important;
}


/* GLOW STATUS — replaces solid green fill */
.unit.green{
  background:#fafafa !important;
  border-color:#7ee787 !important;
  box-shadow:
    0 0 0 2px rgba(126,231,135,.75),
    0 0 9px rgba(126,231,135,.75),
    0 0 18px rgba(126,231,135,.38) !important;
  z-index:4;
}

.y-container.green{
  /* Keep its normal alternating container color; glow communicates the status. */
  border:2px solid #7ee787 !important;
  box-shadow:
    0 0 0 2px rgba(126,231,135,.55),
    0 0 10px rgba(126,231,135,.82),
    0 0 20px rgba(126,231,135,.42),
    0 5px 7px rgba(0,0,0,.55) !important;
}

/* Preserve contrasting stacked colors even when both units glow. */
.y-stack:has(.y-half.top .y-container.green):has(.y-half.bottom .y-container.green)
.y-half.top .y-container.green,
.y-stack:has(.y-half.top .y-container.green):has(.y-half.bottom .y-container.green)
.y-half.bottom .y-container.green{
  border:2px solid #7ee787 !important;
}

/* Glow button indicates when the currently selected unit is glowing. */
#green.glow-active{
  background:#2d6137 !important;
  color:#fff !important;
  box-shadow:
    0 0 0 2px rgba(126,231,135,.72),
    0 0 10px rgba(126,231,135,.65);
}


/* Single-line top toolbar */
header{
  padding:8px 12px !important;
}
.single-toolbar{
  display:flex;
  align-items:center;
  gap:7px;
  overflow-x:auto;
  overflow-y:hidden;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch;
}
.single-toolbar .viewbar,
.single-toolbar .controls{
  display:flex;
  align-items:center;
  gap:6px;
  margin:0 !important;
  overflow:visible !important;
  flex:none;
}
.single-toolbar button,
.single-toolbar .mode{
  flex:none;
}
.status{
  display:none !important;
}


/* ===== Redesigned Highlight Feature ===== */
.unit.green{
  background:#fafafa !important;
  border-color:#d5b35a !important;
  box-shadow:
    inset 0 0 0 2px rgba(255,216,112,.34),
    0 0 0 2px rgba(255,207,82,.7),
    0 0 10px rgba(255,190,55,.32) !important;
  z-index:5;
}

.y-container.green{
  position:absolute !important;
  border:2px solid #ffd66b !important;
  box-shadow:
    0 0 0 2px rgba(255,214,107,.45),
    0 0 10px rgba(255,188,61,.5),
    0 5px 7px rgba(0,0,0,.55) !important;
}

/* A cleaner soft halo around the whole selected Yard slot/container */
.y-half.highlighted{
  outline:2px solid rgba(255,210,95,.95) !important;
  outline-offset:2px !important;
  box-shadow:
    0 0 10px rgba(255,189,58,.42),
    0 0 18px rgba(255,189,58,.20) !important;
  border-radius:4px;
}

/* Button state */
#green{
  background:#f1f3f5 !important;
  color:#111 !important;
  border:1px solid #c9cfd4 !important;
}
#green.glow-active{
  background:#ffd66b !important;
  color:#161616 !important;
  box-shadow:
    0 0 0 2px rgba(255,214,107,.28),
    0 0 8px rgba(255,189,58,.32) !important;
}

/* Avoid the old bright green stripe/edge */
.y-container.green{
  border-left:2px solid #ffd66b !important;
}


/* =========================================================
   HIGHLIGHT V2 — single clean cyan halo, no yellow/green mix
   ========================================================= */

/* The old status flag remains in data, but it no longer changes fill color. */
.unit.green{
  background:#fafafa !important;
  border-color:#74e9ff !important;
  outline:none !important;
  box-shadow:
    0 0 0 2px rgba(116,233,255,.86),
    0 0 8px rgba(70,213,242,.72),
    0 0 16px rgba(70,213,242,.32) !important;
}

/* Yard containers keep their normal container color. */
.y-container.green,
.y-stack:has(.y-half.top .y-container.green):has(.y-half.bottom .y-container.green) .y-half.top .y-container.green,
.y-stack:has(.y-half.top .y-container.green):has(.y-half.bottom .y-container.green) .y-half.bottom .y-container.green{
  border:2px solid #74e9ff !important;
  border-left:2px solid #74e9ff !important;
  box-shadow:
    0 0 0 2px rgba(116,233,255,.70),
    0 0 9px rgba(70,213,242,.78),
    0 0 18px rgba(70,213,242,.38),
    0 5px 7px rgba(0,0,0,.52) !important;
}

/* Highlight the individual TOP or BOTTOM position with the same single halo. */
.y-half.highlighted{
  outline:none !important;
  border-color:transparent !important;
  box-shadow:none !important;
}

/* Selection alone should NOT add a second colored border in Yard View. */
.y-half.selected{
  outline:none !important;
  box-shadow:none !important;
}

/* Grid selection is subtle and neutral so it does not compete with Highlight. */
.unit.selected:not(.green){
  outline:2px solid rgba(150,166,176,.72) !important;
  outline-offset:-2px !important;
  box-shadow:none !important;
}

/* Highlight button */
#green{
  background:#eef2f4 !important;
  color:#111820 !important;
  border:1px solid #c4ccd1 !important;
  box-shadow:none !important;
}
#green.glow-active{
  background:#173943 !important;
  color:#d8fbff !important;
  border:1px solid #74e9ff !important;
  box-shadow:
    0 0 0 1px rgba(116,233,255,.45),
    0 0 8px rgba(70,213,242,.42) !important;
}


/* Darker Grid View background */
#gridView .yardgrid,
#gridView .rowlabels{
  background:#aeb4b6 !important;
}
#gridView .viewport{
  background:#c3c8ca !important;
}


/* Highlight mode behavior */
#green.glow-active{
  background:#173943 !important;
  color:#d8fbff !important;
  border:1px solid #74e9ff !important;
  box-shadow:0 0 8px rgba(70,213,242,.42) !important;
}

/* Hide all highlight visuals without deleting saved highlight state */
.highlights-hidden .unit.green{
  border-color:#aeb4b7 !important;
  box-shadow:none !important;
}
.highlights-hidden .y-container.green{
  border-color:rgba(255,255,255,.14) !important;
  box-shadow:0 5px 7px rgba(0,0,0,.55) !important;
}
.highlights-hidden .y-half.highlighted{
  outline:none !important;
  box-shadow:none !important;
}


/* Remove vertical gray divider/background strip */
.sheet{
  column-gap:0 !important;
}
#gridView .track{
  border-right:none !important;
  box-shadow:none !important;
}
#gridView .yardgrid{
  border-left:none !important;
}
.yard-shell{
  column-gap:0 !important;
  position:relative;
}
.y-track{
  border-right:none !important;
  box-shadow:none !important;
}
.y-map{
  border-left:none !important;
}
.y-right{
  min-width:96px;
  box-sizing:border-box;
  position:relative;
  z-index:2;
  overflow:visible;
}


/* ===== Highlight redesign: full square + gold unit ===== */

/* GRID VIEW: full rectangular highlight around the entire unit cell */
.unit.green{
  background:#d4a928 !important;
  border:2px solid #ffd75a !important;
  outline:2px solid #ffd75a !important;
  outline-offset:-2px !important;
  box-shadow:
    0 0 0 1px rgba(255,215,90,.45),
    0 0 8px rgba(255,193,39,.38) !important;
  color:#111 !important;
  z-index:5;
}
.unit.green .label{
  color:#111 !important;
}

/* YARD VIEW: highlighted container turns gold */

      const u=document.createElement('div');
      u.className='unit'+(d.green?' green':'')+(selectedIndex===i?' selected':'');
      u.dataset.i=i;
      u.innerHTML='<button class="label"></button>';
      u.querySelector('.label').textContent=d.text||'';
      grid.appendChild(u);
    }
  }

  for(let r=0;r<rows;r++){
    const t=document.createElement('div');
    t.textContent='TOP';

    const b=document.createElement('div');
    b.textContent='BOTTOM';
    b.style.marginBottom='10px';

    labels.append(t,b);
  }
}
function renderYard(){
  const panel=document.getElementById('yardView');
  const rows=rowsCount();
  let stacks='', labs='';

  for(let r=0;r<rows;r++){
    const machineRow=(r===rows-1);

    for(let bay=0;bay<7;bay++){
      const topIndex=r*14 + bay*2;
      const bottomIndex=topIndex+1;

      const top=machineRow ? {text:'',green:false} : (state[topIndex]||{text:'',green:false});
      const bottom=machineRow ? {text:'',green:false} : (state[bottomIndex]||{text:'',green:false});

      const yardPalette=['c1','c2','c3','c4','c5','c6'];
      let topCls=yardPalette[(r*7+bay)%yardPalette.length] + (top.green?' green':'');
      let bottomCls=yardPalette[(r*7+bay+1)%yardPalette.length] + (bottom.green?' green':'');

      if(top.text && bottom.text && topCls===bottomCls){
        bottomCls=yardPalette[(r*7+bay+2)%yardPalette.length];
      }

      stacks+=`<div class="y-stack ${machineRow?'machine-row':''}">
        <div class="y-half top ${top.text?'':'empty'} ${top.green?'highlighted':''} ${selectedIndex===topIndex?'selected':''}" data-i="${topIndex}">
          ${top.text?`<div class="y-container ${topCls}" data-i="${topIndex}">${top.text}</div>`:''}
        </div>
        <div class="y-half bottom ${bottom.text?'':'empty'} ${bottom.green?'highlighted':''} ${selectedIndex===bottomIndex?'selected':''}" data-i="${bottomIndex}">
          ${bottom.text?`<div class="y-container ${bottomCls}" data-i="${bottomIndex}">${bottom.text}</div>`:''}
        </div>
      </div>`;
    }

    labs+='<div class="y-pair"><div>TOP</div><div>BOTTOM</div></div>';
  }

function select(i){
  selectedIndex=i;
  renderAll();
  updateGlowButton();
}

function updateGlowButton(){
  const btn=document.getElementById('green');
  if(!btn) return;
  btn.classList.toggle('glow-active',highlightMode);
  btn.textContent=highlightMode ? 'Gold Highlight On' : 'Gold Highlight';
}

function editSelected(){
  if(selectedIndex===null)return alert('Tap a position first.');
  const v=prompt('Unit number:',state[selectedIndex].text||'');
  if(v!==null){state[selectedIndex].text=v.trim().toUpperCase();save();renderAll();}
}
function removeSelected(){
  if(selectedIndex===null)return alert('Tap a position first.');
  state[selectedIndex]={text:'',green:false};save();renderAll();
}
function greenSelected(){
  highlightMode=!highlightMode;
  document.body.classList.toggle('highlight-focus',highlightMode);
  updateGlowButton();
}
function dropTo(target){
  if(dragIndex===null||target===null||dragIndex===target)return;
  const mode=document.querySelector('input[name=mode]:checked').value;
  const a={...state[dragIndex]},b={...state[target]};
  if(mode==='swap'){state[dragIndex]=b;state[target]=a}
  else{state[target]=a;state[dragIndex]={text:'',green:false}}
  save();renderAll();
}
function makeGhost(text,x,y){
  dragGhost=document.createElement('div');dragGhost.className='ghost';dragGhost.textContent=text||'BLANK';
  document.body.appendChild(dragGhost);dragGhost.style.left=(x+12)+'px';dragGhost.style.top=(y+12)+'px';
}
function clearGhost(){dragGhost?.remove();dragGhost=null;dragIndex=null;document.querySelectorAll('.target').forEach(x=>x.classList.remove('target'))}

document.addEventListener('click',e=>{
  if(didDrag){
    didDrag=false;
    return;
  }
  const gu=e.target.closest('.unit');
  const yh=e.target.closest('.y-half');

  if(gu){
    const i=Number(gu.dataset.i);
    if(highlightMode){
      state[i].green=!state[i].green;
      save();
      renderAll();
      updateGlowButton();
    }else{
      select(i);
    }
    return;
  }

  if(yh){
    const i=Number(yh.dataset.i);
    if(highlightMode){
      state[i].green=!state[i].green;
      save();
      renderAll();
      updateGlowButton();
    }else{
      select(i);
    }
  }
});

document.addEventListener('pointerdown',e=>{
  const gu=e.target.closest('.unit');
  const yc=e.target.closest('.y-container');

  // Do not start a drag when clicking toolbar controls.
  if(!gu && !yc) return;

  const targetEl = gu || yc;
  const i = Number(targetEl.dataset.i);
  if(Number.isNaN(i)) return;

  e.preventDefault();

  dragIndex=i;
  dragStartX=e.clientX;
  dragStartY=e.clientY;
  didDrag=false;
  const text=state[i]?.text||'';
  if(!text){
    dragIndex=null;
    return;
  }

  targetEl.setPointerCapture?.(e.pointerId);
  makeGhost(text,e.clientX,e.clientY);
});
document.addEventListener('pointermove',e=>{
  if(dragIndex===null)return;
  if(Math.hypot(e.clientX-dragStartX,e.clientY-dragStartY)>5) didDrag=true;
  e.preventDefault();
  dragGhost.style.left=(e.clientX+12)+'px';dragGhost.style.top=(e.clientY+12)+'px';
  document.querySelectorAll('.target').forEach(x=>x.classList.remove('target'));
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.unit,.y-half');
  if(t)t.classList.add('target');
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(dragIndex===null)return;
  const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.unit,.y-half');
  dropTo(t?Number(t.dataset.i):null);clearGhost();
});

document.addEventListener('touchstart',e=>{
  const gu=e.target.closest('.unit');
  const yc=e.target.closest('.y-container');

  if((!gu && !yc) || e.touches.length!==1) return;

  const targetEl=gu || yc;
  const i=Number(targetEl.dataset.i);
  if(Number.isNaN(i)) return;

  const text=state[i]?.text||'';
  if(!text) return;

  e.preventDefault();

  dragIndex=i;
  const t=e.touches[0];
  dragStartX=t.clientX;
  dragStartY=t.clientY;
  didDrag=false;
  makeGhost(text,t.clientX,t.clientY);
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(dragIndex===null||e.touches.length!==1)return;
  const mt=e.touches[0];
  if(Math.hypot(mt.clientX-dragStartX,mt.clientY-dragStartY)>5) didDrag=true;
  e.preventDefault();
  const t=e.touches[0];dragGhost.style.left=(t.clientX+12)+'px';dragGhost.style.top=(t.clientY+12)+'px';
  document.querySelectorAll('.target').forEach(x=>x.classList.remove('target'));
  const el=document.elementFromPoint(t.clientX,t.clientY)?.closest('.unit,.y-half');
  if(el)el.classList.add('target');
},{passive:false});
document.addEventListener('touchend',e=>{
  if(dragIndex!==null) return;
  if(didDrag){
    didDrag=false;
    return;
  }

  const gu=e.target.closest('.unit');
  const yh=e.target.closest('.y-half');

  if(gu){
    const i=Number(gu.dataset.i);
    if(highlightMode){
      state[i].green=!state[i].green;
      save();
      renderAll();
      updateGlowButton();
    }else{
      select(i);
    }
    return;
  }

  if(yh){
    const i=Number(yh.dataset.i);
    if(highlightMode){
      state[i].green=!state[i].green;
      save();
      renderAll();
      updateGlowButton();
    }else{
      select(i);
    }
  }
},{passive:true});

document.getElementById('edit').onclick=editSelected;
document.getElementById('remove').onclick=removeSelected;
document.getElementById('green').onclick=greenSelected;
document.getElementById('hideHighlights').onclick=()=>{
  highlightsHidden=!highlightsHidden;
  document.body.classList.toggle('highlights-hidden',highlightsHidden);
  document.getElementById('hideHighlights').textContent = highlightsHidden ? 'Show Highlights' : 'Hide Highlights';
};

document.getElementById('addTop').onclick=()=>{state=[...blankRow(),...state];selectedIndex=null;save();renderAll();}
document.getElementById('addBottom').onclick=()=>{state=[...state,...blankRow()];selectedIndex=null;save();renderAll();}
document.getElementById('removeTop').onclick=()=>{if(rowsCount()>1){state=state.slice(14);selectedIndex=null;save();renderAll();}}
document.getElementById('removeBottom').onclick=()=>{if(rowsCount()>1){state=state.slice(0,-14);selectedIndex=null;save();renderAll();}}

document.getElementById('gridBtn').onclick=()=>{
  document.getElementById('gridView').style.display='block';
  document.getElementById('yardView').style.display='none';
  gridBtn.classList.add('active');yardBtn.classList.remove('active');fitStackingView();
}
document.getElementById('yardBtn').onclick=()=>{
  document.getElementById('gridView').style.display='none';
  document.getElementById('yardView').style.display='block';
  yardBtn.classList.add('active');gridBtn.classList.remove('active');fitStackingView();
}

load();renderAll();updateGlowButton();
</script>
</body>
</html>
