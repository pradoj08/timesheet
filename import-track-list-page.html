<body>
<main class="app">
  <header class="hero"><h1>Import Consist</h1></header>
  <section class="panel">
    <div class="toolbar"><label class="field"><span>Arrival day</span><input id="arrivalDay" type="number" min="1" max="31"></label><button id="pasteClipboard" type="button">Paste Clipboard</button><button id="renderBtn" class="primary" type="button">Show Tracklist</button><button id="importConsistBtn" type="button">Import Consist CSV</button><input id="consistFile" type="file" accept=".csv,text/csv" hidden><span class="spacer"></span><button id="clearBtn" class="danger" type="button">Clear</button></div>
    <div class="slots" id="slots" hidden></div>
    <div id="message" class="message">Paste one or more tracklists. Only rows containing a valid equipment ID and Car Kind pattern are imported.</div>
    <div id="summary" class="summary"></div>
  </section>
  <section class="panel train-panel" id="trainPanel"><div class="train-head"><h2>Train Order Pictorial</h2><div class="train-head-actions"><div id="trainLegend" class="train-legend" aria-label="Container type color key"></div><button id="houstonOnlyBtn" class="view-toggle" type="button" aria-pressed="false">Houston Only (0)</button><button id="highlightUpsBtn" class="view-toggle" type="button" aria-pressed="false">Highlight UPS</button><button id="toggleTableBtn" class="view-toggle" type="button" aria-pressed="false">Hide Table</button><button id="toggleCondensedTrain" class="view-toggle" type="button" aria-pressed="false" aria-label="Switch train pictorial to Compact View">Compact View</button></div></div><div id="trainBoards" class="train-boards"><div class="train-scroll"><div class="train"><div class="empty-train">Import a tracklist to build the train.</div></div></div></div><div class="details" id="trainDetails"><table><thead><tr><th>Order</th><th>Railcar</th><th>Slot</th><th>Inbound</th><th>Unit ID</th><th>Car Kind</th><th>Pool</th><th>Unit Size</th><th>Required Rail Ft</th><th>Consignee</th><th>Status</th></tr></thead><tbody id="detailsBody"><tr><td colspan="11">No units imported.</td></tr></tbody></table></div></section>
</main>
<script>
const STORAGE_KEY="conglobal-import-track-list-v1";
const CONDENSED_VIEW_KEY="conglobal-import-track-list-condensed-v1";
const HIGHLIGHT_UPS_KEY="conglobal-import-track-list-highlight-ups-v1";
const HOUSTON_ONLY_KEY="conglobal-import-track-list-houston-only-v1";
const TABLE_HIDDEN_KEY="conglobal-import-track-list-table-hidden-v1";
let importedConsistUnits=null;
let renderedUpsCount=0;
let renderedHoustonCount=0;
const POOLS={HUBGROUP:"DCLI",OCEANNETEXPP:"FGCP",SCHNEINATION:"SNCZ",STGSTALLC:"DCLI",MAERSK:"DCLI",SWIFTINTERMO:"DCLI",MODETRALLC:"DCLI",LOUPINTERMOD:"DCLI",CMACGMAMELLC:"TGRP",UNITEDPARSER:"DCLI",MATSONLOGIST:"DCLI",RADIANROARAI:"DCLI",YANGMINMARLI:"TGRP",LOUPLOGCOLLC:"DCLI",UNIONPACRRRA:"DCLI",INTERMSALES:"DCLI",CHEMLOGIX:"DCLI",TARGETTRANSP:"DCLI",RETRANSPORTA:"DCLI",FEDEXGROPACS:"DCLI"};
const SHIPPERS=[["HUBGROUP","DCLI"],["TARGETTRANSP","DCLI"],["LOUPLOGCOLLC","DCLI"],["LOUPINTERMOD","DCLI"],["RETRANSPORTA","DCLI"],["FEDEXGROPACS","DCLI"],["SCHNEINATION","SNCZ"],["OCEANNETEXPP","FGCP"],["CMACGMAMELLC","TGRP"],["YANGMINMARLI","TGRP"]];
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
function consigneeCandidate(value){const candidate=String(value||"").replace(/\s+/g," ").trim();const compact=candidate.toUpperCase().replace(/[^A-Z0-9]/g,"");return /^(LOADED|EMPTY|LOAD|RAILCAR|RAILCARPENGRND|PENGRND|GROUND|GRND|NONE|NA|0)$/.test(compact)?"":candidate}
function sizeFromCarKind(value){const car=String(value||"").toUpperCase();if(car==="Q70"||car.includes("K7"))return 53;if(car==="Q40"||car.includes("K4"))return 40;if(car.includes("K5"))return 45;if(car==="Q10"||car.includes("K1"))return 20;return 0}
function footageFor(size,trailer){if(trailer)return 65;if(size===20)return 39;if(size===40||size===45||size===53)return 45;return 0}
function normalizePool(value){const compact=String(value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");const hit=compact.match(/TGRP|TRGP|FGCP|SNCZ|SNBZ|DCLI|DCLP/);if(!hit)return "";return ({TRGP:"TGRP",SNBZ:"SNCZ",DCLP:"DCLI"})[hit[0]]||hit[0]}
function poolFromConsignee(value){const compact=String(value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");if(POOLS[compact])return POOLS[compact];const key=Object.keys(POOLS).sort((a,b)=>b.length-a.length).find(item=>compact.startsWith(item)||item.startsWith(compact));return key?POOLS[key]:""}
function parseLine(line,inbound,listIndex,rowIndex,railcar){
  const text=String(line||"").replace(/[\u2002\u2003\u2009\u00a0]/g," ").trim();if(!text)return null;
  const tokens=text.split(/\s+/).filter(Boolean);let unitIndex=-1,unitId="",unitTokenCount=0;
  for(let i=0;i<tokens.length;i++){const compact=tokens[i].toUpperCase().replace(/[^A-Z0-9]/g,"");if(/^[A-Z]{3,5}\d{3,8}$/.test(compact)){unitIndex=i;unitTokenCount=1;unitId=compact.replace(/^([A-Z]{3,5})(\d{3,8})$/,"$1 $2");break}const next=String(tokens[i+1]||"").replace(/\D/g,"");if(/^[A-Z]{3,5}$/i.test(tokens[i])&&/^\d{3,8}$/.test(next)){unitIndex=i;unitTokenCount=2;unitId=tokens[i].toUpperCase()+" "+next;break}}
  if(unitIndex<0)return null;const offset=unitTokenCount;const aar=tokens[unitIndex+offset]||"",carKind=tokens[unitIndex+offset+1]||"",loadEmpty=tokens[unitIndex+offset+2]||"",service=tokens[unitIndex+offset+3]||"";
  if(!/^[A-Z]\d{2,3}$/i.test(aar)||!/^[A-Z0-9]{2,6}$/i.test(carKind)||!/^[LE]$/i.test(loadEmpty)||!/^(TOFC|COFC)$/i.test(service))return null;
  const priority=tokens[unitIndex+offset+4]||"",type=tokens[unitIndex+offset+5]||"",tail=tokens.slice(unitIndex+offset+6).join(" ");
  const consignee=consigneeCandidate(type).toUpperCase()||"BLANK";const fingerprint=[text,consignee,tail].join(" ").toUpperCase();const trailer=carKind.toUpperCase().includes("V");let pool=trailer?"TRAILER":normalizePool(fingerprint);
  if(!pool&&carKind.toUpperCase().includes("K7")&&/^(UMXU|EMHU)/.test(unitId))pool="DCLI";
  if(!pool)pool=poolFromConsignee(consignee);if(!pool){const shipper=SHIPPERS.find(([name])=>fingerprint.replace(/[^A-Z0-9]/g,"").includes(name));pool=shipper?shipper[1]:"UNKNOWN"}
  const position=String(tokens[Math.max(0,unitIndex-1)]||"").toUpperCase();const size=sizeFromCarKind(carKind);return{inbound,listIndex,rowIndex,railcar:railcar||"",position,unitId,aar,carKind,loadEmpty,service,priority,type,consignee,destination:/HOUSTON/i.test(text)?"HOUSTON":"",pool,size,footage:footageFor(size,trailer),status:pool==="UNKNOWN"?"Needs pool mapping":"Mapped"};
}
function parseAll(){const units=[];document.querySelectorAll(".slot").forEach((slot,listIndex)=>{const inbound=slot.querySelector("input").value.trim()||`Inbound ${listIndex+1}`;let railcar="",sequence="";slot.querySelector("textarea").value.split(/\r?\n/).forEach((line,rowIndex)=>{const seq=String(line||"").match(/^\s*Seq:\s*([^\s]+)/i);if(seq){sequence=seq[1]||sequence;const equipment=String(line).match(/Equipment ID:\s*([A-Z]{2,5}\s*\d+)/i);railcar=equipment?equipment[1].replace(/\s+/g," ").trim():`Seq ${sequence}`;return}const unit=parseLine(line,inbound,listIndex,rowIndex,railcar);if(unit)units.push(unit)})});const unique=new Map();units.forEach(unit=>unique.set(unit.unitId.replace(/\W/g,""),unit));return [...unique.values()]}
function parseCsvRows(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<String(text).length;i++){const char=text[i],next=text[i+1];if(char==='"'&&quoted&&next==='"'){cell+='"';i++;continue}if(char==='"'){quoted=!quoted;continue}if(char===','&&!quoted){row.push(cell);cell="";continue}if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')i++;row.push(cell);if(row.some(value=>value!==""))rows.push(row);row=[];cell="";continue}cell+=char}row.push(cell);if(row.some(value=>value!==""))rows.push(row);return rows}
function parseConsistCsv(text,fileName){const matrix=parseCsvRows(text);if(matrix.length<2)throw new Error("The CSV has no consist rows.");const headers=matrix[0].map(value=>String(value).trim());const records=matrix.slice(1).map(values=>Object.fromEntries(headers.map((header,index)=>[header,String(values[index]??"").trim()])));const platforms=[];let railcar="",platform=null;const finishPlatform=()=>{if(platform){platforms.push(platform);platform=null}};records.forEach((record,rowIndex)=>{const equipment=record["Equipment ID"],platformId=record["Platform ID"],containerId=record["Container ID"],kind=record["Car Kind"];if(equipment)railcar=equipment;if(platformId&&/^P/i.test(kind)){finishPlatform();platform={railcar:railcar||platformId,platformId,length:Number(record.Length)||0,seq:record.Seq||String(rowIndex+1),containers:[]};return}if(containerId&&platform)platform.containers.push({record,rowIndex})});finishPlatform();if(!platforms.length)throw new Error("No railcar platform rows were found in this CSV.");const wellIndex=new Map(),units=[];platforms.forEach((item,platformIndex)=>{const next=(wellIndex.get(item.railcar)||0)+1;wellIndex.set(item.railcar,next);const well=String.fromCharCode(64+Math.min(next,26));const bottomCount=Math.ceil(item.containers.length/2);item.containers.forEach(({record,rowIndex},containerIndex)=>{const carKind=record["Car Kind"]||"",trailer=carKind.toUpperCase().includes("V"),size=sizeFromCarKind(carKind),consignee=consigneeCandidate(record.Consignee).toUpperCase()||"BLANK";let pool=trailer?"TRAILER":poolFromConsignee(consignee);if(!pool&&carKind.toUpperCase().includes("K7")&&/^(UMXU|EMHU)/.test(record["Container ID"]))pool="DCLI";if(!pool)pool="UNKNOWN";const level=containerIndex<bottomCount?"B":"T",slot=level==="B"?containerIndex+1:containerIndex-bottomCount+1;units.push({inbound:fileName.replace(/\.csv$/i,""),listIndex:0,rowIndex,railcar:item.railcar,platformKey:`${item.railcar}|${item.platformId}|${item.seq}`,platformLength:item.length,position:`${well}${level}${slot}`,unitId:record["Container ID"],aar:"",carKind,loadEmpty:record["L/E"]||"",service:record.Commodity||"",priority:"",type:"",consignee,destination:record["City State"]||record.Destination||"",pool,size,footage:footageFor(size,trailer),status:pool==="UNKNOWN"?"Needs pool mapping":"Mapped"})})});if(!units.length)throw new Error("No containers were found beneath the railcar platforms.");return units}
function positionParts(unit){const match=String(unit.position||"").match(/^([A-Z])([BT])(\d)?$/);return match?{well:match[1],level:match[2],slot:Number(match[3]||1)}:{well:"?",level:"B",slot:1}}
function trainGroups(units){const groups=[];let current=null,lastKey="";units.forEach(unit=>{const key=`${unit.listIndex}|${unit.railcar||"NO-RAILCAR"}`;if(!current||key!==lastKey){current={key,label:unit.railcar||unit.inbound,units:[]};groups.push(current);lastKey=key}current.units.push(unit)});return groups}
function unitTypeKey(unit){if(unit.pool==="TRAILER")return "trailer";if(unit.pool==="UNKNOWN"||!unit.size)return "unknown";return `${String(unit.pool).toLowerCase()}-${unit.size}`}
function unitTypeLabel(unit){if(unit.pool==="TRAILER")return "TRAILER";if(unit.pool==="UNKNOWN"||!unit.size)return "UNKNOWN";return `${unit.pool} ${unit.size}`}
function stackUnit(unit){const type=unitTypeKey(unit),ups=String(unit.consignee||"").toUpperCase().replace(/[^A-Z0-9]/g,"").startsWith("UNITEDPARSER");return `<div class="stack-unit type-${esc(type)}${ups?" ups-unit":""}" title="${esc(unit.unitId)} · ${esc(unitTypeLabel(unit))}${ups?" · United Parcel Service":""}"><span class="slot-id">${esc(unit.position||"Slot ?")}</span><b class="stack-id">${esc(unit.unitId)}</b><span class="stack-need">${esc(unitTypeLabel(unit))}</span></div>`}
function renderRailcar(group,cumulativeFootage){const wells=[];group.units.forEach(unit=>{const pos=positionParts(unit);let well=wells.find(item=>item.name===pos.well);if(!well){well={name:pos.well,top:[],bottom:[]};wells.push(well)}const level=unit.pool==="TRAILER"?"bottom":pos.level==="T"?"top":"bottom";well[level].push({...unit,slotNumber:pos.slot})});const compactWidth=wells.reduce((width,well)=>width+(well.bottom.filter(unit=>unit.pool==="TRAILER").length>1?99:48),0)+Math.max(0,wells.length-1)*3+12;return `<div class="train-car-group" style="--car-flex:${Math.max(1,wells.length)};--car-width:${Math.max(60,compactWidth)}px"><i class="coupler"></i><section class="railcar"><div class="railcar-meta">${cumulativeFootage.toLocaleString()}'</div><div class="railcar-label" title="${esc(group.label)}">${esc(group.label)}</div><div class="well-row">${wells.map(well=>{const trailerPair=well.bottom.filter(unit=>unit.pool==="TRAILER").length>1;return `<div class="well${trailerPair?" trailer-pair":""}"><div class="stack-level top">${well.top.sort((a,b)=>a.slotNumber-b.slotNumber).map(stackUnit).join("")}</div><div class="stack-level bottom">${well.bottom.sort((a,b)=>a.slotNumber-b.slotNumber).map(stackUnit).join("")}</div><span class="well-name">WELL ${esc(well.name)}</span></div>`}).join("")}</div><i class="rail-wheel left"></i><i class="rail-wheel right"></i></section></div>`}
function renderTrainPictorial(units){let cumulative=0;return trainGroups(units).map(group=>{const platformLengths=new Map(group.units.filter(unit=>unit.platformKey).map(unit=>[unit.platformKey,Number(unit.platformLength)||0]));const csvFootage=[...platformLengths.values()].reduce((sum,value)=>sum+value,0);const groupFootage=csvFootage||Math.max(45,...group.units.map(unit=>Number(unit.footage)||0));cumulative+=groupFootage;return renderRailcar(group,cumulative)}).join("")}
function poolBreakdownHtml(units){const counts=new Map();units.forEach(unit=>{const label=unit.pool==="TRAILER"?"TRAILER 65 ft":`${unit.pool} ${unit.size||"?"}'`;counts.set(label,(counts.get(label)||0)+1)});return [...counts].sort((a,b)=>a[0].localeCompare(b[0])).map(([label,count])=>`<span class="board-pool-pill">${esc(label)} <b>${count}</b></span>`).join("")}
function render(){const allUnits=importedConsistUnits||parseAll(),houstonUnits=allUnits.filter(unit=>/\bHOUSTON\b/i.test(String(unit.destination||""))),houstonOnly=trainPanel.classList.contains("houston-only"),units=houstonOnly?houstonUnits:allUnits,counts={};renderedHoustonCount=houstonUnits.length;units.forEach(unit=>{const label=unit.pool==="TRAILER"?"TRAILER 65 ft":`${unit.pool} ${unit.size||"?"}'`;counts[label]=(counts[label]||0)+1});renderedUpsCount=units.filter(unit=>String(unit.consignee||"").toUpperCase().replace(/[^A-Z0-9]/g,"").startsWith("UNITEDPARSER")).length;summary.innerHTML=Object.entries(counts).sort().map(([label,count])=>`<span class="pill">${esc(label)} <b>${count}</b></span>`).join("");
  const unknown=units.filter(unit=>unit.pool==="UNKNOWN");message.className="message "+(units.length?(unknown.length?"bad":"good"):"");message.textContent=!units.length?(houstonOnly&&allUnits.length?"No Houston-destined equipment was found.":"No valid unit rows were detected."):unknown.length?`${units.length} units shown. ${unknown.length} require an authoritative pool mapping; no pool was guessed.`:`${units.length} units shown and every pool was mapped.`;
  trainLegend.innerHTML=[...new Map(units.map(unit=>[unitTypeKey(unit),unitTypeLabel(unit)])).entries()].sort((a,b)=>a[1].localeCompare(b[1])).map(([key,label])=>`<span class="train-key type-${esc(key)}"><i></i>${esc(label)}</span>`).join("");
  const inboundGroups=[...units.reduce((groups,unit)=>{const name=unit.inbound||"Unnamed inbound";if(!groups.has(name))groups.set(name,[]);groups.get(name).push(unit);return groups},new Map())];trainBoards.innerHTML=inboundGroups.length?inboundGroups.map(([name,boardUnits])=>{const consist=importedConsistUnits?`${renderTrainPictorial(boardUnits)}<div class="locomotive" title="Head end"><i class="wheel one"></i><i class="wheel two"></i></div>`:`<div class="locomotive"><i class="wheel one"></i><i class="wheel two"></i></div>${renderTrainPictorial(boardUnits)}`;return `<section class="inbound-train-board"><h3 class="inbound-train-title"><span class="inbound-train-name">${esc(name)}</span><span class="train-symbol" aria-hidden="true">TRAIN</span><span class="train-board-pools">${poolBreakdownHtml(boardUnits)}</span></h3><div class="train-scroll"><div class="train">${consist}</div></div></section>`}).join(""):'<div class="train-scroll"><div class="train"><div class="empty-train">Import a tracklist to build the train.</div></div></div>';
  detailsBody.innerHTML=units.length?units.map((unit,index)=>`<tr><td>${index+1}</td><td>${esc(unit.railcar||"Not supplied")}</td><td>${esc(unit.position||"Unknown")}</td><td>${esc(unit.inbound)}</td><td>${esc(unit.unitId)}</td><td>${esc(unit.carKind)}</td><td>${esc(unit.pool)}</td><td>${unit.size?unit.size+" ft":"Unknown"}</td><td>${unit.footage?unit.footage+" ft":"Unknown"}</td><td>${esc(unit.consignee)}</td><td>${esc(unit.status)}</td></tr>`).join(""):'<tr><td colspan="11">No units imported.</td></tr>';updateHoustonButton();updateUpsHighlightButton();save();requestAnimationFrame(fitCondensedTrainToScreen);
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({day:arrivalDay.value,slots:[...document.querySelectorAll(".slot")].map(slot=>({name:slot.querySelector("input").value,text:slot.querySelector("textarea").value}))}))}catch{}}
function restore(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(!saved)return;arrivalDay.value=saved.day||"";(saved.slots||[]).forEach((item,index)=>{const slot=document.querySelectorAll(".slot")[index];if(slot){slot.querySelector("input").value=item.name||"";slot.querySelector("textarea").value=item.text||""}})}catch{}}
slots.innerHTML=Array.from({length:5},(_,index)=>`<label class="slot"><input aria-label="Inbound ${index+1} name" placeholder="Inbound ${index+1} name"><textarea aria-label="Tracklist ${index+1}" placeholder="Paste tracklist ${index+1} here..."></textarea></label>`).join("");arrivalDay.value=new Date().getDate();restore();renderBtn.addEventListener("click",()=>{importedConsistUnits=null;render()});importConsistBtn.addEventListener("click",()=>consistFile.click());consistFile.addEventListener("change",async()=>{const file=consistFile.files&&consistFile.files[0];if(!file)return;try{importedConsistUnits=parseConsistCsv(await file.text(),file.name);render();message.className="message good";message.textContent=`${file.name} imported rear-to-head: ${trainGroups(importedConsistUnits).length} railcars, ${importedConsistUnits.length} containers.`}catch(error){importedConsistUnits=null;message.className="message bad";message.textContent=`Consist import failed: ${error.message}`}});document.querySelectorAll("input,textarea").forEach(input=>input.addEventListener("change",save));pasteClipboard.addEventListener("click",async()=>{slots.hidden=false;try{importedConsistUnits=null;document.querySelector(".slot textarea").value=await navigator.clipboard.readText();render()}catch{message.className="message bad";message.textContent="Clipboard access was blocked. Paste with Ctrl+V instead."}});let clearArmed=false,clearTimer=null;clearBtn.addEventListener("click",()=>{if(!clearArmed){clearArmed=true;clearBtn.textContent="Click again to clear";clearTimer=setTimeout(()=>{clearArmed=false;clearBtn.textContent="Clear"},3500);return}clearTimeout(clearTimer);importedConsistUnits=null;consistFile.value="";slots.hidden=true;document.querySelectorAll(".slot input,.slot textarea").forEach(input=>input.value="");localStorage.removeItem(STORAGE_KEY);clearArmed=false;clearBtn.textContent="Clear";render()});
function fitCondensedTrainToScreen(){}
function setCondensedTrainView(condensed){trainPanel.classList.toggle("condensed-pictorial",condensed);toggleCondensedTrain.setAttribute("aria-pressed",condensed?"true":"false");toggleCondensedTrain.textContent=condensed?"Actual Size":"Compact View";toggleCondensedTrain.setAttribute("aria-label",condensed?"Switch train pictorial to Actual Size":"Switch train pictorial to Compact View");try{localStorage.setItem(CONDENSED_VIEW_KEY,condensed?"1":"0")}catch{}requestAnimationFrame(fitCondensedTrainToScreen)}

function setUpsHighlight(active){trainPanel.classList.toggle("highlight-ups",active);highlightUpsBtn.setAttribute("aria-pressed",active?"true":"false");updateUpsHighlightButton();try{localStorage.setItem(HIGHLIGHT_UPS_KEY,active?"1":"0")}catch{}}

setUpsHighlight((()=>{try{return localStorage.getItem(HIGHLIGHT_UPS_KEY)==="1"}catch{return false}})());
function updateHoustonButton(){const active=trainPanel.classList.contains("houston-only");houstonOnlyBtn.textContent=`${active?"Houston Only":"Show Houston Only"} (${renderedHoustonCount})`}
function setHoustonOnly(active,rerender=true){trainPanel.classList.toggle("houston-only",active);houstonOnlyBtn.setAttribute("aria-pressed",active?"true":"false");updateHoustonButton();try{localStorage.setItem(HOUSTON_ONLY_KEY,active?"1":"0")}catch{}if(rerender)render()}
houstonOnlyBtn.addEventListener("click",()=>setHoustonOnly(!trainPanel.classList.contains("houston-only")));
setHoustonOnly((()=>{try{return localStorage.getItem(HOUSTON_ONLY_KEY)==="1"}catch{return false}})(),false);
